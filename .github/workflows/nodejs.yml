name: Node CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  coverage:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@^24.22.1
          cache: true
          require-lockfile: true
      - name: test
        run: pnpm coverage
      - name: codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@^24.22.1
          cache: true
          require-lockfile: true
      - name: lint
        run: pnpm lint

  build-rollup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@^24.22.1
          cache: true
          require-lockfile: true
      - name: build-rollup
        run: pnpm build-rollup

  build-tsc:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@^24.22.1
          cache: true
          require-lockfile: true
      - name: build-tsc
        run: pnpm build-tsc

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    strategy:
      matrix:
        node-version: [^24.22.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true
      - name: test
        run: pnpm test

  type-coverage:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@^24.22.1
          cache: true
          require-lockfile: true
      - name: type coverage
        run: pnpm type-coverage
