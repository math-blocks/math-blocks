name: Node CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  coverage:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm coverage
      - name: codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: check published types
        run: pnpm check-dist-types

  typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    strategy:
      matrix:
        node-version: [^24.22.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test

  type-coverage:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: type coverage
        run: pnpm type-coverage

  e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Install browsers for Playwright
        run: pnpm playwright install --with-deps chromium firefox webkit
      - name: e2e
        run: pnpm e2e
