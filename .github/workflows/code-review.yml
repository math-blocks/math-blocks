name: Code review

# Runs only on PR comments by k4b7 that start with /code-review. Pushes to a
# PR branch do not start a run.
on:
  issue_comment:
    types: [created]

jobs:
  # Runs the pr-review skill when k4b7 comments `/code-review [low|medium|high]`
  # on a PR, and posts each finding as an inline comment.
  code-review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == '/code-review' ||
        startsWith(github.event.comment.body, '/code-review ') ||
        startsWith(github.event.comment.body, format('/code-review{0}', fromJSON('"\n"'))) ||
        startsWith(github.event.comment.body, format('/code-review{0}', fromJSON('"\r"')))) &&
      github.event.comment.user.login == 'k4b7'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # The 👀 reaction tells the commenter the review has started.
      - name: React to the command
        run: gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=eyes --silent
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The skill comes from the default branch, so a PR branched before the
      # skill landed can still be reviewed.
      - name: Check out the PR branch
        run: |
          cp .claude/skills/pr-review/SKILL.md "$RUNNER_TEMP/pr-review.md"
          gh pr checkout ${{ github.event.issue.number }}
          mkdir -p .claude/skills/pr-review
          cp "$RUNNER_TEMP/pr-review.md" .claude/skills/pr-review/SKILL.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            COMMAND: ${{ github.event.comment.body }}

            Read .claude/skills/pr-review/SKILL.md and follow it to review this PR.
            The level is the word after /code-review in COMMAND, or medium when none is given.
            The PR branch is checked out in the working directory.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh api repos/math-blocks/math-blocks/pulls/*/comments *),Bash(gh api repos/math-blocks/math-blocks/issues/*/comments *),Bash(gh api -X PATCH repos/math-blocks/math-blocks/issues/comments/* *),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(sha256sum)"

      # The cost is the API-price equivalent the action reports. A subscription
      # run counts against usage limits instead of being billed this amount.
      - name: Post the run's cost and log refused tool calls
        if: always()
        run: |
          file="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ ! -f "$file" ]; then
            echo "No execution file at $file, so no cost to post."
            exit 0
          fi
          read -r cost turns ms < <(jq -rs 'flatten | map(select(.type == "result")) | last |"\(.total_cost_usd // 0) \(.num_turns // 0) \(.duration_ms // 0)"' "$file")
          # The action hides Claude's output, so list each refused tool call
          # here. That is what to check when the review posts less than it should.
          echo "Refused tool calls:"
          jq -rs 'flatten | map(select(.type == "result")) | last | .permission_denials // [] | .[]
            | "- \(.tool_name): \((.tool_input.command // (.tool_input | tostring)) | .[0:300])"' "$file"
          # A comment written in the web editor ends each line with \r\n.
          level=$(printf '%s\n' "$COMMAND" | tr -d '\r' | head -n 1 | awk '{print $2}')
          case "$level" in low|medium|high) ;; *) level=medium ;; esac
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf 'Cost of this `/code-review %s` run: **$%.2f** at API prices, over %s turns in %ds. [View run](%s)\n' \
            "$level" "$cost" "$turns" "$((ms / 1000))" "$run_url" | gh pr comment "$PR_NUMBER" --body-file -
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          COMMAND: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
